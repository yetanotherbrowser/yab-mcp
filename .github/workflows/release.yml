# On a tag v<version>: test, pack the .mcpb onto a GitHub release, and
# publish to npm through trusted publishing (no token: GitHub's OIDC, with
# provenance). The first npm publish is manual, see PUBLISHING.md. The MCP
# registry is published by hand too: its key stays off GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches every manifest
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - run: npm test
      - run: npm run pack:mcpb
      - name: GitHub release with the desktop extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "yab-mcp@$version" version >/dev/null 2>&1; then
            echo "yab-mcp $version is on npm already (published by hand)"; exit 0
          fi
          npm install -g npm@latest
          npm publish --access public
